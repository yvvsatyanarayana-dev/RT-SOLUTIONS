{% extends "base.html" %}

{% block title %}404 - Not Found | RT Solutions{% endblock %}

{% block content %}
<div class="page-header reveal" style="min-height: 80vh; display: flex; align-items: center; padding: 0;">
  <div class="container text-center" style="max-width: 600px; text-align: center; margin: 0 auto;">
    <div style="font-family: var(--font-display); font-size: clamp(8rem, 20vw, 12rem); font-weight: 800; color: rgba(0,0,0,0.04); line-height: 1; margin-bottom: -1rem; letter-spacing: -0.05em;">
      404
    </div>
    <div class="glass-panel" style="padding: 3rem; position: relative; z-index: 2;">
      <h1 class="page-title" style="font-size: 2.25rem; margin-bottom: 1rem; letter-spacing: -0.02em;">Endpoint Not Found</h1>
      <p class="page-desc" style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 2.5rem; line-height: 1.6;">The requested resource could not be located. It may have been deprecated or moved to a new route.</p>
      
      <a href="{{ url_for('index') }}" class="btn btn-primary" style="padding: 1rem 2.5rem; font-size: 1.05rem;">Return to System Core</a>
    </div>
  </div>
</div>
{% endblock %}
